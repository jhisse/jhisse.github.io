baseURL: "https://www.josehisse.dev/"
defaultContentLanguage: "pt-br"
languageCode: "pt-br"
languageName: "Português"
title: "José Hisse"
cleanDestinationDir: true
copyright: ""
enableRobotsTXT: true
timeZone: "America/Sao_Paulo"
removePathAccents: true
timeout: 120s
buildFuture: true

permalinks:
  blog: "/blog/:filename/"

disableKinds:
  - taxonomy
  - term
  - section

mediaTypes:
  text/markdown:
    suffixes: ["md"]

outputFormats:
  Markdown:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true
    isHTML: false
    notAlternative: true
  LLMText:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    isHTML: false
    notAlternative: true

outputs:
  page:
    - HTML
    - Markdown
  home:
    - HTML
    - RSS
    - LLMText

params:
  description: >-
    Engenheiro de dados (Big Data). Spark, Nifi, ElasticSearch,
    Kafka, Docker, BigQuery, Data lake
  linkedin: https://www.linkedin.com/in/josehisse/
  github: https://github.com/jhisse

minify:
  minifyOutput: true

markup:
  highlight:
    noClasses: false
